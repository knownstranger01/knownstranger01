<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Inquiry - Sunil Paudel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <nav class="navbar">
            <div class="nav-profile">
                <a href="index.html">
                    <img src="images/my pic.jpg" alt="Sunil Paudel">
                </a>
                <div class="logo">
                    <h1>Welcome to my Official Website</h1>
                </div>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="services.html">Services</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="theme-switch">
                <i class="fas fa-moon"></i>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <!-- Inquiry Form Section -->
    <section id="inquiry" style="min-height: 100vh; padding: 6rem 5% 3rem; background: var(--body-bg);">
        <div style="max-width: 1000px; margin: 0 auto; background: var(--card-bg); padding: 3rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
            <h2 style="text-align: center; margin-bottom: 3rem; color: var(--primary-color); font-size: 2.5rem; position: relative;">
                Service Inquiry
                <span style="display: block; width: 60px; height: 3px; background: var(--secondary-color); margin: 1rem auto 0;"></span>
            </h2>
            
            <div class="contact-form" style="max-width: 800px; margin: 0 auto;">
                <form id="inquiryForm" action="https://formsubmit.co/ajax/sunil.paudel13@gmail.com" method="POST" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div style="grid-column: 1/2;">
                        <label for="name" style="display: block; margin-bottom: 0.5rem; color: var(--text-color); font-weight: 500;">Your Name</label>
                        <input type="text" id="name" name="name" required style="width: 100%; padding: 1rem; border: 2px solid var(--secondary-color); border-radius: 8px; font-size: 1rem; background: var(--body-bg); color: var(--text-color); transition: all 0.3s ease;">
                    </div>
                    
                    <div style="grid-column: 2/3;">
                        <label for="email" style="display: block; margin-bottom: 0.5rem; color: var(--text-color); font-weight: 500;">Your Email</label>
                        <input type="email" id="email" name="email" required style="width: 100%; padding: 1rem; border: 2px solid var(--secondary-color); border-radius: 8px; font-size: 1rem; background: var(--body-bg); color: var(--text-color); transition: all 0.3s ease;">
                    </div>
                    
                    <div style="grid-column: 1/2;">
                        <label for="subject" style="display: block; margin-bottom: 0.5rem; color: var(--text-color); font-weight: 500;">Subject</label>
                        <input type="text" id="subject" name="subject" required style="width: 100%; padding: 1rem; border: 2px solid var(--secondary-color); border-radius: 8px; font-size: 1rem; background: var(--body-bg); color: var(--text-color); transition: all 0.3s ease;">
                    </div>
                    
                    <div style="grid-column: 2/3;">
                        <label for="service" style="display: block; margin-bottom: 0.5rem; color: var(--text-color); font-weight: 500;">Select Service</label>
                        <select id="service" name="service" required style="width: 100%; padding: 1rem; border: 2px solid var(--secondary-color); border-radius: 8px; font-size: 1rem; background: var(--body-bg); color: var(--text-color); transition: all 0.3s ease;">
                            <option value="">Choose a service...</option>
                            <option value="Graphic Design">Graphic Design</option>
                            <option value="Video Editing">Video Editing</option>
                            <option value="Other Services">Other Services</option>
                        </select>
                    </div>
                    
                    <div style="grid-column: 1/3;">
                        <label for="message" style="display: block; margin-bottom: 0.5rem; color: var(--text-color); font-weight: 500;">Project Requirements</label>
                        <textarea id="message" name="message" required style="width: 100%; height: 200px; padding: 1rem; border: 2px solid var(--secondary-color); border-radius: 8px; font-size: 1rem; background: var(--body-bg); color: var(--text-color); transition: all 0.3s ease; resize: vertical;"></textarea>
                    </div>
                    
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_subject" value="New Service Inquiry!">
                    <input type="hidden" name="_next" value="thank-you.html">
                    
                    <div style="grid-column: 1/3; text-align: center;">
                        <button type="submit" class="submit-btn" style="background: var(--secondary-color); color: white; padding: 1rem 3rem; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 500; cursor: pointer; transition: all 0.3s ease; margin-top: 1rem;">
                            Send Inquiry
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Loading Spinner -->
    <div class="loading-spinner">
        <div class="spinner"></div>
    </div>

    <!-- Footer Section -->
    <footer>
        <div class="footer-content">
            <div class="social-links">
                <a href="https://www.facebook.com/knownstranger01" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://www.instagram.com/knownstranger01" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://www.youtube.com/@knownstranger01" target="_blank"><i class="fab fa-youtube"></i></a>
                <a href="https://www.linkedin.com/in/sunilpaudel" target="_blank"><i class="fab fa-linkedin"></i></a>
            </div>
            <p>&copy; 2025 All Rights Reserved</p>
        </div>
    </footer>

    <!-- Modal Popup -->
    <div class="modal" id="modalInquiry">
        <div class="modal-content">
            <p>Thank you, your inquiry has been submitted!</p>
            <button onclick="closeModal()">Okay</button>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        document.getElementById('inquiryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const form = this;
            const spinner = document.querySelector('.loading-spinner');
            spinner.classList.add('active');
            
            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = 'thank-you.html';
                } else {
                    alert('Message sending failed. Please try again.');
                    spinner.classList.remove('active');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Message sending failed. Please try again.');
                spinner.classList.remove('active');
            });
        });
    </script>
</body>
</html>
